<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATOSHI SQUARE — 비트코인 커뮤니티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Supabase 라이브러리 (로그인·DB·사진저장) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-soft: #13131c;
    --bg-card: #16161f;
    --border: #26262f;
    --text: #f2f2f5;
    --text-dim: #8a8a96;
    --gold: #f7931a;
    --gold-soft: rgba(247,147,26,0.12);
    --green: #16c784;
    --red: #ea3943;
    --shadow: 0 10px 40px rgba(0,0,0,0.5);
    --radius: 16px;
  }
  [data-theme="light"] {
    --bg: #f5f5f0;
    --bg-soft: #ffffff;
    --bg-card: #ffffff;
    --border: #e4e4dc;
    --text: #141414;
    --text-dim: #6b6b6b;
    --gold: #e07b00;
    --gold-soft: rgba(224,123,0,0.10);
    --green: #00a36c;
    --red: #d62839;
    --shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    transition: background .4s ease, color .4s ease;
    min-height: 100vh;
    line-height: 1.6;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, var(--gold-soft), transparent 70%);
  }
  .wrap { max-width: 880px; margin:0 auto; padding: 0 20px; position:relative; z-index:1; }

  /* HEADER */
  header {
    position: sticky; top:0; z-index:50;
    backdrop-filter: blur(18px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .nav { display:flex; align-items:center; justify-content:space-between; height:68px; }
  .logo { display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:-0.5px; }
  .logo-mark {
    width:34px; height:34px; border-radius:9px;
    background: linear-gradient(135deg, var(--gold), #ffb347);
    display:grid; place-items:center; color:#0a0a0f; font-weight:900; font-size:1.1rem;
    box-shadow: 0 4px 14px var(--gold-soft);
  }
  .logo span { color: var(--gold); }
  .nav-right { display:flex; align-items:center; gap:12px; }
  .theme-btn {
    width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
    background: var(--bg-soft); color:var(--text); cursor:pointer; font-size:1.1rem;
    display:grid; place-items:center; transition: transform .3s, background .3s;
  }
  .theme-btn:hover { transform: rotate(20deg); }
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:.9rem;
    padding:10px 18px; border-radius:10px; transition: transform .15s, box-shadow .25s; white-space:nowrap;
  }
  .btn:active { transform: scale(.96); }
  .btn-google {
    background: var(--bg-soft); color:var(--text); border:1px solid var(--border);
    display:flex; align-items:center; gap:9px;
  }
  .btn-google:hover { box-shadow: var(--shadow); }
  .g-icon { width:18px; height:18px; }
  .user-chip { display:flex; align-items:center; gap:10px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--gold),#ffb347); display:grid; place-items:center; color:#0a0a0f; font-weight:700; }
  .logout { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:.85rem; font-family:inherit; text-decoration:underline; }

  /* TICKER */
  .ticker {
    margin:26px 0; padding:26px; border-radius:var(--radius);
    background: linear-gradient(145deg, var(--bg-card), var(--bg-soft));
    border:1px solid var(--border); box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px;
    position:relative; overflow:hidden;
  }
  .ticker::after {
    content:"₿"; position:absolute; right:-20px; bottom:-50px; font-size:200px;
    color:var(--gold); opacity:.05; font-family:'Space Grotesk';
  }
  .ticker-label { display:flex; align-items:center; gap:12px; }
  .btc-badge { width:46px; height:46px; border-radius:50%; background:var(--gold); color:#0a0a0f; display:grid; place-items:center; font-size:1.5rem; font-weight:900; }
  .ticker-label small { color:var(--text-dim); font-size:.8rem; display:block; }
  .ticker-label strong { font-size:1.05rem; font-family:'Space Grotesk'; }
  .price-main { text-align:right; }
  .price-val { font-family:'JetBrains Mono',monospace; font-size:2rem; font-weight:700; letter-spacing:-1px; white-space:nowrap; }
  .price-krw::before { content:"₩ "; color:var(--text-dim); font-size:1.4rem; }
  .price-meta { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:4px; font-size:.85rem; }
  .chg { font-family:'JetBrains Mono'; font-weight:700; padding:2px 8px; border-radius:6px; }
  .chg.up { color:var(--green); background:color-mix(in srgb,var(--green) 14%,transparent); }
  .chg.down { color:var(--red); background:color-mix(in srgb,var(--red) 14%,transparent); }
  .live-dot { display:inline-flex; align-items:center; gap:5px; color:var(--text-dim); font-size:.75rem; }
  .live-dot i { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
  .usd-line { color:var(--text-dim); font-size:.85rem; font-family:'JetBrains Mono'; margin-top:2px; }
  .ticker { cursor:pointer; transition:transform .2s, box-shadow .3s; }
  .ticker:hover { transform:translateY(-2px); }
  .ticker-hint { position:absolute; bottom:10px; left:26px; font-size:.72rem; color:var(--gold); opacity:.75; font-weight:700; z-index:2; }

  /* CHART PANEL */
  .chart-panel {
    max-height:0; overflow:hidden; opacity:0;
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:18px;
    transition:max-height .45s ease, opacity .35s ease, margin .3s, padding .3s;
    padding:0 20px;
  }
  .chart-panel.open { max-height:420px; opacity:1; padding:18px 20px; }
  .chart-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  @media(max-width:560px){
    .chart-tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
    .chart-tab { flex:0 0 auto; }
  }
  .chart-tab {
    border:1px solid var(--border); background:var(--bg-soft); color:var(--text-dim);
    font-family:'JetBrains Mono',monospace; font-size:.78rem; font-weight:700;
    padding:6px 11px; border-radius:8px; cursor:pointer; transition:.18s; white-space:nowrap;
  }
  .chart-tab:hover { color:var(--text); border-color:var(--gold); }
  .chart-tab.active { background:var(--gold); color:#0a0a0f; border-color:var(--gold); }
  .chart-stage { position:relative; width:100%; height:240px; }
  .chart-stage svg { width:100%; height:100%; display:block; }
  .chart-tooltip {
    position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-130%);
    background:var(--text); color:var(--bg); font-family:'JetBrains Mono'; font-size:.72rem;
    font-weight:700; padding:4px 8px; border-radius:6px; white-space:nowrap; transition:opacity .12s; z-index:5;
  }
  .chart-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:6px; }
  .chart-foot #chartRange { font-family:'JetBrains Mono'; font-size:.8rem; color:var(--text-dim); }
  .chart-demo-tag { font-size:.68rem; color:var(--gold); background:var(--gold-soft); padding:3px 9px; border-radius:20px; font-weight:700; }

  /* COMPOSER */
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:18px; box-shadow:var(--shadow); }
  .composer-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .composer h2 { font-size:1rem; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  /* 글쓰기 옆 강조 로그인 버튼 */
  .btn-google-lg { font-size:.92rem; padding:11px 20px; box-shadow:0 4px 16px var(--gold-soft); }
  .btn-google-lg:hover { transform:translateY(-1px); }
  .composer textarea {
    width:100%; min-height:84px; resize:vertical; background:var(--bg-soft); border:1px solid var(--border);
    border-radius:10px; padding:13px; color:var(--text); font-family:inherit; font-size:.95rem;
  }
  .title-input {
    width:100%; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px;
    padding:12px 13px; color:var(--text); font-family:inherit; font-size:1rem; font-weight:700;
    margin-bottom:10px;
  }
  .title-input:focus { outline:none; border-color:var(--gold); }
  .title-input:disabled { opacity:.5; cursor:not-allowed; }
  .composer textarea:focus { outline:none; border-color:var(--gold); }
  .composer textarea:disabled { opacity:.5; cursor:not-allowed; }
  .preview-img { margin-top:12px; position:relative; display:inline-block; }
  .preview-img img { max-height:180px; border-radius:10px; border:1px solid var(--border); }
  .preview-img button { position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(0,0,0,.7); color:#fff; cursor:pointer; }
  .composer-bar { display:flex; align-items:center; justify-content:space-between; margin-top:13px; }
  .icon-btn { background:var(--bg-soft); border:1px solid var(--border); color:var(--text-dim); padding:9px 14px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:.85rem; display:flex; align-items:center; gap:7px; transition:.2s; }
  .icon-btn:hover:not(:disabled) { color:var(--gold); border-color:var(--gold); }
  .icon-btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-post { background:var(--gold); color:#0a0a0f; }
  .btn-post:disabled { opacity:.4; cursor:not-allowed; }
  .login-hint { text-align:center; color:var(--text-dim); font-size:.9rem; padding:8px 0; }
  .login-hint b { color:var(--gold); }

  /* FEED */
  .feed-head { display:flex; align-items:center; justify-content:space-between; margin:24px 4px 14px; }
  .feed-head h3 { font-size:1.1rem; }
  .feed-head span { color:var(--text-dim); font-size:.85rem; }
  .post { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:0; margin-bottom:16px; box-shadow:var(--shadow); animation:rise .5s ease backwards; overflow:hidden; }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
  /* 제목 줄 (항상 보임, 클릭 영역) */
  .post-title-row { display:flex; align-items:center; gap:12px; padding:17px 20px; cursor:pointer; transition:background .2s; }
  .post-title-row:hover { background:var(--bg-soft); }
  .post-title-main { flex:1; min-width:0; }
  .post-title-main h4 { font-size:1.02rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .post-title-meta { color:var(--text-dim); font-size:.78rem; margin-top:3px; display:flex; gap:10px; }
  .post-title-meta span { display:flex; align-items:center; gap:3px; }
  .chevron { color:var(--text-dim); transition:transform .3s; font-size:.9rem; flex-shrink:0; }
  .post.open .chevron { transform:rotate(180deg); }
  /* 펼쳐지는 내용 */
  .post-detail { max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .post.open .post-detail { max-height:2000px; }
  .post-detail-inner { padding:0 20px 18px; }
  .post-head { display:flex; align-items:center; gap:11px; margin-bottom:11px; }
  .post-head .avatar { width:40px; height:40px; }
  .post-head .meta b { font-size:.95rem; }
  .post-head .meta small { color:var(--text-dim); font-size:.78rem; display:block; }
  .post-body { font-size:.97rem; white-space:pre-wrap; word-break:break-word; }
  .post-body img { margin-top:12px; max-width:100%; border-radius:12px; border:1px solid var(--border); }
  .post-actions { display:flex; gap:18px; margin-top:14px; padding-top:13px; border-top:1px solid var(--border); }
  .act { display:flex; align-items:center; gap:6px; color:var(--text-dim); cursor:pointer; font-size:.85rem; background:none; border:none; font-family:inherit; transition:.2s; }
  .act:hover { color:var(--gold); }
  .act.liked { color:var(--red); }
  .comments { margin-top:14px; padding-top:13px; border-top:1px solid var(--border); display:none; }
  .comments.open { display:block; }
  .comment { display:flex; gap:9px; margin-bottom:11px; }
  .comment .avatar { width:30px; height:30px; font-size:.8rem; flex-shrink:0; }
  .comment .c-body { background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:8px 12px; flex:1; }
  .comment .c-body b { font-size:.82rem; }
  .comment .c-body small { color:var(--text-dim); font-size:.72rem; margin-left:6px; }
  .comment .c-body p { font-size:.88rem; margin-top:2px; }
  .comment-form { display:flex; gap:9px; margin-top:10px; }
  .comment-form input { flex:1; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:9px 13px; color:var(--text); font-family:inherit; font-size:.88rem; }
  .comment-form input:focus { outline:none; border-color:var(--gold); }
  .comment-form input:disabled { opacity:.5; }
  .comment-form button { background:var(--gold); color:#0a0a0f; border:none; border-radius:10px; padding:0 16px; cursor:pointer; font-weight:700; font-family:inherit; }
  .comment-form button:disabled { opacity:.4; cursor:not-allowed; }
  .locked-note { font-size:.8rem; color:var(--text-dim); text-align:center; padding:6px; }

  /* 관련 글 추천 */
  .related { margin-top:16px; padding-top:14px; border-top:1px dashed var(--border); }
  .related-head { font-size:.85rem; font-weight:700; color:var(--gold); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .related-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; transition:.18s; }
  .related-item:hover { border-color:var(--gold); transform:translateX(3px); }
  .related-item .r-rank { width:22px; height:22px; border-radius:50%; background:var(--gold-soft); color:var(--gold); display:grid; place-items:center; font-size:.72rem; font-weight:700; flex-shrink:0; }
  .related-item .r-body { flex:1; min-width:0; }
  .related-item .r-body b { font-size:.88rem; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .related-item .r-body small { color:var(--text-dim); font-size:.72rem; }
  .related-empty { font-size:.82rem; color:var(--text-dim); padding:4px 2px; }

  footer { text-align:center; color:var(--text-dim); font-size:.8rem; padding:36px 0 50px; }
  .demo-tag { display:inline-block; background:var(--gold-soft); color:var(--gold); padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; margin-bottom:8px; }

  /* TOAST */
  .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:12px 22px; border-radius:12px; font-size:.88rem; font-weight:500; opacity:0; pointer-events:none; transition:.35s; z-index:100; box-shadow:var(--shadow); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media(max-width:560px){
    .price-val{font-size:1.5rem}
    .nav{height:60px}
    .logo{font-size:1.1rem}
    .ticker{padding:20px}
    .composer-top{flex-direction:column; align-items:flex-start; gap:10px}
    .btn-google-lg{width:100%; justify-content:center}
  }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="logo">
      <div class="logo-mark">₿</div>
      SATOSHI <span>SQUARE</span>
    </div>
    <div class="nav-right">
      <button class="theme-btn" id="themeBtn" title="테마 전환">🌙</button>
      <div id="authAreaTop"></div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- LIVE TICKER -->
  <div class="ticker" id="tickerBox" onclick="toggleChart()" title="클릭하면 차트가 열려요">
    <div class="ticker-label">
      <div class="btc-badge">₿</div>
      <div>
        <strong>Bitcoin</strong>
        <small>BTC / KRW · 업비트 기준</small>
      </div>
    </div>
    <div class="price-main">
      <div class="price-val price-krw" id="priceKrw">—</div>
      <div class="price-meta">
        <span class="chg up" id="chg">+0.00%</span>
        <span class="live-dot"><i></i> 5초마다 갱신</span>
      </div>
      <div class="usd-line" id="priceUsd">$ —</div>
    </div>
    <div class="ticker-hint" id="tickerHint">📈 클릭하면 차트 보기</div>
  </div>

  <!-- CHART PANEL -->
  <div class="chart-panel" id="chartPanel">
    <div class="chart-tabs" id="chartTabs"></div>
    <div class="chart-stage">
      <svg id="chartSvg" viewBox="0 0 600 240" preserveAspectRatio="none"></svg>
      <div class="chart-tooltip" id="chartTip"></div>
    </div>
    <div class="chart-foot">
      <span id="chartRange">—</span>
      <span class="chart-demo-tag">업비트 실시간 캔들 기준</span>
    </div>
  </div>

  <!-- COMPOSER -->
  <div class="card composer">
    <div class="composer-top">
      <h2>💬 새 글 쓰기</h2>
      <div id="authArea"></div>
    </div>
    <input type="text" id="titleInput" class="title-input" placeholder="제목을 입력하세요" maxlength="60">
    <textarea id="postInput" placeholder="비트코인에 대해 무슨 생각을 하고 계신가요?"></textarea>
    <div class="preview-img" id="imgPreview" style="display:none">
      <img id="imgPreviewEl" src="" alt="">
      <button onclick="clearImage()">✕</button>
    </div>
    <div class="composer-bar">
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="photoBtn" onclick="document.getElementById('fileInput').click()">📷 사진</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      <button class="btn btn-post" id="postBtn" onclick="submitPost()">게시</button>
    </div>
    <div class="login-hint" id="loginHint" style="display:none">
      글을 쓰려면 <b>구글 로그인</b>이 필요해요 👆
    </div>
  </div>

  <!-- FEED -->
  <div class="feed-head">
    <h3>🔥 커뮤니티 피드</h3>
    <span>누구나 읽을 수 있어요 · 글/댓글은 로그인 후</span>
  </div>
  <div id="feed"></div>

  <footer>
    SATOSHI SQUARE · 비트코인 커뮤니티<br>
    투자 정보는 참고용이며, 투자 책임은 본인에게 있습니다.
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* =================================================================
   ⚙️ 설정값 — 아래 3줄만 본인 Supabase 값으로 바꾸세요
   (Supabase 대시보드 → Project Settings → API 에서 복사)
   ================================================================= */
const SUPABASE_URL = "여기에_PROJECT_URL_붙여넣기";
const SUPABASE_KEY = "여기에_ANON_PUBLIC_KEY_붙여넣기";
/* ================================================================= */

let supa = null;
const SUPA_READY = SUPABASE_URL.startsWith("http") && SUPABASE_KEY.length > 20;
if (SUPA_READY) {
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

/* ---------------- STATE ---------------- */
let currentUser = null;       // null = 비로그인
let pendingImageFile = null;  // 업로드할 실제 파일
let pendingImagePreview = null;
let lastPrice = null;

/* ---------------- DATA ---------------- */
let posts = [];          // Supabase에서 불러옴
let openPostId = null;   // 현재 펼쳐진 글

/* ---------------- THEME ---------------- */
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = () => {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
};

/* ---------------- AUTH (demo) ---------------- */
function renderAuth(){
  const area = document.getElementById('authArea');      // 글쓰기 옆
  const top = document.getElementById('authAreaTop');    // 헤더 우측
  if(currentUser){
    area.innerHTML = `
      <div class="user-chip">
        <div class="avatar">${currentUser.initial}</div>

async function submitPost(){
  if(!currentUser) return;
  const titleEl = document.getElementById('titleInput');
  const input = document.getElementById('postInput');
  const postBtn = document.getElementById('postBtn');
  const title = titleEl.value.trim();
  const text = input.value.trim();
  if(!title){ toast("제목을 입력해주세요"); titleEl.focus(); return; }
  if(!text && !pendingImageFile){ toast("내용이나 사진을 넣어주세요"); return; }

  postBtn.disabled = true; postBtn.textContent = "올리는 중...";
  try {
    let imgUrl = null;
    // 1) 사진이 있으면 Storage에 업로드
    if(pendingImageFile){
      const ext = pendingImageFile.name.split('.').pop();
      const path = `${currentUser.id}/${Date.now()}.${ext}`;
      const { error: upErr } = await supa.storage.from('post-images').upload(path, pendingImageFile);
      if(upErr) throw upErr;
      const { data: pub } = supa.storage.from('post-images').getPublicUrl(path);
      imgUrl = pub.publicUrl;
    }
    // 2) 글 저장
    const { error } = await supa.from('posts').insert({
      user_id: currentUser.id,
      author_name: currentUser.name,
      title, body: text,
      tags: autoTags(title+' '+text),
      image_url: imgUrl
    });
    if(error) throw error;
    titleEl.value=''; input.value=''; clearImage();
    await loadPosts();
    toast("게시되었어요 ✨");
  } catch(e){
    console.error(e);
    toast("게시 실패: " + (e.message||"잠시 후 다시 시도"));
  } finally {
    postBtn.disabled = false; postBtn.textContent = "게시";
  }
}
// 본문에서 주요 키워드를 태그로 자동 추출 (추천용)
function autoTags(text){
  const dict = ["존버","장기투자","단타","분할매수","반감기","사이클","분석","차트","지지선","상승","하락","초보","질문","호재","악재","고래","ETF","채굴"];
  const found = dict.filter(k=>text.includes(k));
  return found.length ? found : ["잡담"];
}

// 같은 태그를 많이 공유하는 글을 추천
function renderRelated(post){
  const scored = posts
    .filter(x=>x.id!==post.id)
    .map(x=>{
      const shared = (x.tags||[]).filter(t=>(post.tags||[]).includes(t));
      return { post:x, score:shared.length, shared };
    })
    .filter(x=>x.score>0)
    .sort((a,b)=> b.score-a.score || b.post.likes-a.post.likes)
    .slice(0,3);

  const items = scored.length ? scored.map((s,idx)=>`
    <div class="related-item" onclick="event.stopPropagation(); openPost(${s.post.id})">
      <div class="r-rank">${idx+1}</div>
      <div class="r-body">
        <b>${esc(s.post.title)}</b>
        <small>👤 ${esc(s.post.name)} · 공통 주제: ${s.shared.map(t=>'#'+esc(t)).join(' ')}</small>
      </div>
    </div>`).join('')
    : `<div class="related-empty">아직 관련된 글이 없어요. 첫 글을 남겨보세요!</div>`;

  return `
    <div class="related">
      <div class="related-head">🔎 이 글과 관련된 글</div>
      ${items}
    </div>`;
}

async function toggleLike(id){
  if(!currentUser){ toast("좋아요는 로그인 후에 가능해요"); return; }
  const p = posts.find(x=>x.id==id);
  const willLike = !p.liked;
  // 화면 먼저 갱신 (체감 속도)
  p.liked=willLike; p.likes+= willLike?1:-1;
  const btn = document.querySelector(`.act[data-like="${id}"]`);
  if(btn){ btn.classList.toggle('liked', p.liked); btn.innerHTML = `${p.liked?'❤️':'🤍'} <span>${p.likes}</span>`; }
  // DB 반영
  try{
    if(willLike){
      await supa.from('likes').insert({ post_id:id, user_id:currentUser.id });
    } else {
      await supa.from('likes').delete().eq('post_id',id).eq('user_id',currentUser.id);
    }
  }catch(e){ console.error(e); }
}

/* ---------------- LOAD FROM SUPABASE ---------------- */
function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return "방금 전";
  if(diff < 3600) return Math.floor(diff/60)+"분 전";
  if(diff < 86400) return Math.floor(diff/3600)+"시간 전";
  if(diff < 604800) return Math.floor(diff/86400)+"일 전";
  return new Date(iso).toLocaleDateString('ko-KR');
}
async function loadPosts(){
  if(!SUPA_READY) return;
  // 글 + 댓글 + 좋아요 한 번에 가져오기
  const { data: rows, error } = await supa
    .from('posts')
    .select('*, comments(*), likes(user_id)')
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  posts = (rows||[]).map(r=>({
    id: r.id,
    name: r.author_name || "사용자",
    initial: (r.author_name||"?").charAt(0),
    time: timeAgo(r.created_at),
    title: r.title,
    body: r.body || "",
    tags: r.tags || [],
    img: r.image_url || null,
    likes: (r.likes||[]).length,
    liked: currentUser ? (r.likes||[]).some(l=>l.user_id===currentUser.id) : false,
    comments: (r.comments||[])
      .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
      .map(c=>({ name:c.author_name||"사용자", initial:(c.author_name||"?").charAt(0), time:timeAgo(c.created_at), text:c.body }))
  }));
  renderFeed();
}

/* ---------------- LIVE PRICE (실제 시도 → 실패 시 모의) ---------------- */
let mockPrice = 95352000;   // 모의 시작 가격 (원) - 업비트 실제 시세 기준
const MOCK_BASE = 95012000; // 변동률 계산용 기준가 (전일 종가 ≈ +0.34%)
const USDKRW = 1385;

async function fetchPrice(){
  try{
    const res = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-BTC',{cache:'no-store'});
    if(!res.ok) throw new Error('bad');
    const data = await res.json();
    const t = data[0];
    updatePrice(t.trade_price, t.signed_change_rate*100, true);
  }catch(e){
    // 데모 환경에서 외부호출이 막히면 모의 가격으로 자연스럽게 변동
    const drift = (Math.random()-0.48) * 130000;
    mockPrice = Math.max(89000000, mockPrice + drift);
    const chg = ((mockPrice-MOCK_BASE)/MOCK_BASE)*100;
    updatePrice(mockPrice, chg, false);
  }
}
function updatePrice(krw, changePct, real){
  const krwEl=document.getElementById('priceKrw');
  const usdEl=document.getElementById('priceUsd');
  const chgEl=document.getElementById('chg');
  krwEl.textContent = Math.round(krw).toLocaleString('ko-KR');
  usdEl.textContent = '$ ' + Math.round(krw/USDKRW).toLocaleString('en-US') + (real?' · 실시간':' · 모의 데이터');
  const up = changePct>=0;
  chgEl.className = 'chg '+(up?'up':'down');
  chgEl.textContent = (up?'▲ +':'▼ ')+changePct.toFixed(2)+'%';
  if(lastPrice!==null){
    krwEl.style.color = krw>lastPrice ? 'var(--green)' : krw<lastPrice ? 'var(--red)' : 'var(--text)';
    setTimeout(()=>krwEl.style.color='var(--text)', 700);
  }
  lastPrice = krw;
}

async function loadChart(key){

    else if(tf.api.type==='days') url = `https://api.upbit.com/v1/candles/days?market=KRW-BTC&count=${tf.count}`;

    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('bad');
    const data = await res.json();

    prices = data.reverse().map(c=>({ p:c.trade_price, t:c.candle_date_time_kst }));
    document.getElementById('chartRange').textContent = tf.rangeText + ' · 실시간';
  } catch(e){

  }
  drawChart(prices);

// 기간별 현실적인 모의 시계열 생성
function mockSeries(tf){
  const n = tf.count;
  // 기간이 길수록 변동폭 크게
  const volMap = { '1m':0.0006, '5m':0.0012, '10m':0.002, '30m':0.004, '1h':0.006, '24h':0.012, '1w':0.03, '1M':0.06, '1y':0.22 };
  const vol = volMap[tf.key] || 0.01;
  let price = mockPrice;
  const arr = [];
  // 끝점을 현재가로 맞추기 위해 뒤에서부터 생성 후 뒤집기
  for(let i=0;i<n;i++){
    arr.push(price);
    const shock = (Math.random()-0.5) * 2 * vol * price;
    const trend = (Math.random()-0.48) * vol * price * 0.5;
    price = Math.max(60000000, price - shock - trend);
  }
  arr.reverse(); // 시간순
  // 마지막 값을 현재가로 보정
  const diff = mockPrice - arr[arr.length-1];
  return arr.map((p,i)=>({ p: p + diff*(i/(n-1)), t:null }));
}

function drawChart(series){
  const svg = document.getElementById('chartSvg');
  const W=600, H=240, padL=4, padR=4, padT=16, padB=16;
  const vals = series.map(d=>d.p);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min)||1;
  const stepX = (W-padL-padR)/(series.length-1);
  const x = i => padL + i*stepX;
  const y = v => padT + (H-padT-padB) * (1 - (v-min)/span);

  const up = vals[vals.length-1] >= vals[0];
  const stroke = up ? 'var(--green)' : 'var(--red)';

  let line = '', area = '';
  series.forEach((d,i)=>{
    const px=x(i), py=y(d.p);
    line += (i===0?`M${px},${py}`:` L${px},${py}`);
  });
  area = line + ` L${x(series.length-1)},${H-padB} L${x(0)},${H-padB} Z`;

  // 최고/최저 지점
  const maxI = vals.indexOf(max), minI = vals.indexOf(min);

  svg.innerHTML = `
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${up?'#16c784':'#ea3943'}" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="${up?'#16c784':'#ea3943'}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#cg)"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(maxI)}" cy="${y(max)}" r="3" fill="#16c784"/>
    <circle cx="${x(minI)}" cy="${y(min)}" r="3" fill="#ea3943"/>
    <circle id="hoverDot" cx="0" cy="0" r="4" fill="${stroke}" opacity="0"/>
    <line id="hoverLine" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--border)" stroke-width="1" opacity="0"/>
  `;

  // 호버 인터랙션
  const tip = document.getElementById('chartTip');
  const dot = document.getElementById('hoverDot');
  const vline = document.getElementById('hoverLine');
  const stage = svg.parentElement;
  function onMove(ev){
    const rect = svg.getBoundingClientRect();
    const clientX = (ev.touches? ev.touches[0].clientX : ev.clientX);
    const relX = (clientX - rect.left)/rect.width * W;
    let i = Math.round((relX-padL)/stepX);
    i = Math.max(0, Math.min(series.length-1, i));
    const px=x(i), py=y(series[i].p);
    dot.setAttribute('cx',px); dot.setAttribute('cy',py); dot.setAttribute('opacity','1');
    vline.setAttribute('x1',px); vline.setAttribute('x2',px); vline.setAttribute('opacity','0.6');
    tip.style.opacity='1';
    tip.style.left = (px/W*rect.width)+'px';
    tip.style.top = (py/H*rect.height)+'px';
    tip.textContent = '₩' + Math.round(series[i].p).toLocaleString('ko-KR');
  }
  function onLeave(){ dot.setAttribute('opacity','0'); vline.setAttribute('opacity','0'); tip.style.opacity='0'; }
  stage.onmousemove = onMove;
  stage.onmouseleave = onLeave;
  stage.ontouchmove = e=>{ e.preventDefault(); onMove(e); };
  stage.ontouchend = onLeave;
}

/* ---------------- INIT ---------------- */
async function init(){
  // 가격은 설정과 무관하게 항상 작동
  fetchPrice();
  setInterval(fetchPrice, 5000); // 5초마다 갱신

  if(!SUPA_READY){
    // 설정 전: 화면은 보이되 안내 표시
    renderAuth();
    toast("⚙️ Supabase 설정값을 입력하면 로그인·저장이 켜져요");
    return;
  }

  // 로그인 상태 확인
  const { data:{ session } } = await supa.auth.getSession();
  setUserFromSession(session);
  renderAuth();
  await loadPosts();

  // 로그인/로그아웃 변화 감지
  supa.auth.onAuthStateChange(async (_e, session)=>{
    setUserFromSession(session);
    renderAuth();
    await loadPosts();
  });
}
init();
</script>
